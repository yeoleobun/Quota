name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build & Release (macOS arm64)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon & Swift toolchain
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build Quota.app, ZIP, and DMG (arm64)
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}" PACKAGE_DMG=1 ./scripts/build-app.sh
          cd dist
          shasum -a 256 Quota-macos-arm64.zip Quota-macos-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Quota-macos-arm64.dmg
            dist/Quota-macos-arm64.zip
            dist/SHA256SUMS.txt

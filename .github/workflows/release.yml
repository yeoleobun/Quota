name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build & Release (macOS arm64)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon & Swift toolchain
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Import Code Signing Certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if [ -z "$CODESIGN_P12" ] || [ -z "$CODESIGN_PASSWORD" ]; then
            echo "Code signing secrets not set; skipping certificate import."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/quota-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CODESIGN_P12" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"

      - name: Build Quota.app, ZIP, and DMG (arm64)
        env:
          SIGN_IDENTITY: yeoleobun
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}" PACKAGE_DMG=1 ./scripts/build-app.sh
          codesign -dv --verbose=2 dist/Quota.app
          cd dist
          shasum -a 256 Quota-macos-arm64.zip Quota-macos-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Cleanup Temporary Keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/quota-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Install (Apple Silicon — No Gatekeeper Warning)

            **Homebrew (Recommended):**
            ```bash
            brew tap yeoleobun/tap
            brew trust yeoleobun/tap 2>/dev/null || true
            brew install --cask yeoleobun/tap/quota
            ```

            **One-Line Terminal Installer:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/yeoleobun/Quota/main/scripts/install.sh | zsh
            ```
          files: |
            dist/Quota-macos-arm64.dmg
            dist/Quota-macos-arm64.zip
            dist/SHA256SUMS.txt

      - name: Auto-bump yeoleobun/homebrew-tap (when HOMEBREW_TAP_TOKEN secret is set)
        if: github.ref_type == 'tag'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping automatic homebrew-tap push."
            exit 0
          fi
          VERSION="${TAG_NAME#v}"
          ZIP_SHA=$(awk '/Quota-macos-arm64\.zip/ {print $1}' dist/SHA256SUMS.txt)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yeoleobun/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i '' -e "s/version \".*\"/version \"${VERSION}\"/" -e "s/sha256 \".*\"/sha256 \"${ZIP_SHA}\"/" Casks/quota.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/quota.rb
          git diff --cached --quiet || (git commit -m "Bump quota cask to ${VERSION}" && git push origin main)
